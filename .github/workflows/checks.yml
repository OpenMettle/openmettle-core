name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      use_cache:
        description: Restore CI caches (disable for a cold verification run)
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6; resolved 2026-11-14
        with:
          persist-credentials: false
      - name: Check repository hygiene
        run: python3 scripts/check_repository.py
      - name: Check generated API contract fixtures are current
        run: python3 scripts/contract_fixtures.py --check

  rust:
    name: Rust runtime
    runs-on: ubuntu-24.04
    # Twelve authentic prior-release builds run serially (~70-90 s each). A cold run (cache key
    # change) was projected at 20-24 min; keep headroom so a near-miss is not a wasted run.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned toolchain
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
      # Downloads and compiler outputs only; tests always execute below.
      # PRs restore only. Successful main pushes populate the cache.
      - name: Restore Cargo dependencies and build outputs
        if: github.event_name != 'workflow_dispatch' || inputs.use_cache
        id: cargo-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5; MIT; resolved 2026-11-17
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            target
            !target/debug/incremental
          key: cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml', '.cargo/**', '.github/workflows/checks.yml') }}-${{ github.sha }}
          restore-keys: |
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml', '.cargo/**', '.github/workflows/checks.yml') }}-
      - run: cargo fetch --locked
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - run: cargo build --workspace --locked --offline
      - run: cargo test --workspace --locked --offline
      - name: PostgreSQL process integration
        run: cargo test --locked --offline --test runtime -- --ignored
        env:
          TEST_DATABASE_URL: postgres://fixture:fixture@127.0.0.1:5432/fixture?sslmode=disable
      # One authentic prior release per schema version, built into $RUNNER_TEMP/openmettle-vN.
      - name: Build authentic prior releases for schema compatibility
        run: |
          while read -r version sha; do
            case "$version" in ''|'#'*) continue ;; esac
            mkdir -p "$RUNNER_TEMP/openmettle-v$version"
            git archive "$sha" | tar -x -C "$RUNNER_TEMP/openmettle-v$version"
            cargo build --manifest-path "$RUNNER_TEMP/openmettle-v$version/Cargo.toml" --locked --offline --bins
          done <<'RELEASES'
            2 18f52463c9d6bc12dda4bd1558e4597e067018f8
            3 2f1be947aa933177c2e407cd7290bf9909bd08ca
            4 d80e37819f847072dfa272bdddcc1fbee6d622ef
            5 4a51242839e16e1d7b8ad3538887bf8e41081e6e
            6 3978dff2864488bbdd9e748afd7116f39683f129
            7 5ff1d2a8ed5e7424be006e78c16f0c30e784336d
            8 e55aff07527ad6452f8a0d49953b3fc2ffc51352
            9 940b8c2032d863e29fd04ad7c6357ad8cacc42fc
            10 05dd18489242e545e3529b4e3750c74837b05638
            # Membership (schema 11) final commit. It stays reachable only through a merge commit.
            11 0ab3401714762f28a730eae4cd7c91052648dabd
            # Invitations (schema 12): the block A merge, the last release before invitation codes.
            12 4441b4236ad0dd1ea868d507bb10b50d9b0ddb6f
            # Invitation codes (schema 13): the block B merge, the last release before native sign-in.
            13 615dcffc93af18ab0db40a7a2fafc3c0752d4c77
          RELEASES
      # POSTGRES_CONTAINER runs the exact ADR 0014 operator scripts with the pinned service psql.
      - name: PostgreSQL schema, migration and role integration
        run: cargo test --locked --offline --test schema -- --ignored
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          V13_BINARY_DIR: ${{ runner.temp }}/openmettle-v13/target/debug
          V12_BINARY_DIR: ${{ runner.temp }}/openmettle-v12/target/debug
          V11_BINARY_DIR: ${{ runner.temp }}/openmettle-v11/target/debug
          V10_BINARY_DIR: ${{ runner.temp }}/openmettle-v10/target/debug
          V9_BINARY_DIR: ${{ runner.temp }}/openmettle-v9/target/debug
          V8_BINARY_DIR: ${{ runner.temp }}/openmettle-v8/target/debug
          OLD_BINARY_DIR: ${{ runner.temp }}/openmettle-v2/target/debug
          V3_BINARY_DIR: ${{ runner.temp }}/openmettle-v3/target/debug
          V5_BINARY_DIR: ${{ runner.temp }}/openmettle-v5/target/debug
          V4_BINARY_DIR: ${{ runner.temp }}/openmettle-v4/target/debug
          V7_BINARY_DIR: ${{ runner.temp }}/openmettle-v7/target/debug
          V6_BINARY_DIR: ${{ runner.temp }}/openmettle-v6/target/debug
          TEST_DATABASE_URL: postgres://fixture:fixture@127.0.0.1:5432/fixture?sslmode=disable
      # Explicit module filter: runs only the managed-login PostgreSQL tests, never the
      # ignored provider_http proxy child fixture. POSTGRES_CONTAINER runs the exact ADR 0013
      # first-approval script with the pinned service psql.
      - name: PostgreSQL managed login authority integration
        run: |
          cargo test --locked --offline --lib provider_keys::tests::postgres -- --ignored --skip provider_keys::tests::postgres::browser::
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          TEST_DATABASE_URL: postgres://fixture:fixture@127.0.0.1:5432/fixture?sslmode=disable
      # Two journeys, each bounded by the harness's own 75-second alarm.
      - name: Chrome cross-site session qualification
        timeout-minutes: 5
        env:
          TEST_DATABASE_URL: postgres://fixture:fixture@127.0.0.1:5432/fixture?sslmode=disable
        run: |
          python3 -m unittest discover -s tests/browser -v
          case_name=provider_keys::tests::postgres::browser::cross_site_session_lifecycle
          cargo test --locked --offline --lib "$case_name" -- --ignored --exact --list | grep -Fx "$case_name: test"
          cargo test --locked --offline --lib "$case_name" -- --ignored --exact --nocapture
          case_name=provider_keys::tests::postgres::browser::cross_site_native_code_delivery
          cargo test --locked --offline --lib "$case_name" -- --ignored --exact --list | grep -Fx "$case_name: test"
          cargo test --locked --offline --lib "$case_name" -- --ignored --exact --nocapture
      - name: Save Cargo dependencies and build outputs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5; MIT; resolved 2026-11-17
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            target
            !target/debug/incremental
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
    services:
      postgres:
        image: postgres:18.1-bookworm@sha256:cc9f4143a8d2fa8cf3749d0cb4d26ecf2d53a77a2ac807e9ebd67ae22426221a
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fixture -d fixture"
          --health-interval 2s --health-timeout 5s --health-retries 30

  images:
    name: CPU images and dependency recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: docker build --target api --tag openmettle-api:test .
      - run: docker build --target worker --tag openmettle-worker:test .
      - run: docker build --target migrate --tag openmettle-migrate:test .
      - name: Exercise isolated runtime images
        run: bash runtime/verify-images.sh
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
      - name: Exercise isolated migrate image
        run: bash runtime/verify-migrate-image.sh
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
    services:
      postgres:
        image: postgres:18.1-bookworm@sha256:cc9f4143a8d2fa8cf3749d0cb4d26ecf2d53a77a2ac807e9ebd67ae22426221a
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fixture -d fixture"
          --health-interval 2s --health-timeout 5s --health-retries 30
