# Deterministic promtool unit tests for OpenMettle telemetry contract v1 alert rules (ADR 0028).
# Executed in CI via `promtool test rules` inside the pinned prom/prometheus v3.5.0 image.
rule_files:
  - alerts-v1.yaml

evaluation_interval: 30s

tests:
  # --- OpenMettleApiHighServerErrorRatio -------------------------------------------------
  - name: api_high_server_error_ratio_fires_above_threshold
    interval: 30s
    input_series:
      - series: 'openmettle_http_server_requests_total{job="openmettle-api",instance="a",http_request_method="GET",openmettle_route_class="v1",http_response_status_class="2xx"}'
        values: '0+9x30'
      - series: 'openmettle_http_server_requests_total{job="openmettle-api",instance="a",http_request_method="GET",openmettle_route_class="v1",http_response_status_class="5xx"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 12m
        alertname: OpenMettleApiHighServerErrorRatio
        exp_alerts:
          - exp_labels:
              severity: warning
              service: openmettle-api
              signal_contract: v1
            exp_annotations:
              summary: "OpenMettle API HTTP 5xx error ratio exceeded 5%"
              description: "More than 5% of non-probe API HTTP requests returned 5xx over the last 5 minutes."

  - name: api_high_server_error_ratio_ignores_probes_and_worker
    interval: 30s
    input_series:
      - series: 'openmettle_http_server_requests_total{job="openmettle-api",instance="a",http_request_method="GET",openmettle_route_class="readyz",http_response_status_class="5xx"}'
        values: '0+5x30'
      - series: 'openmettle_http_server_requests_total{job="openmettle-api",instance="a",http_request_method="GET",openmettle_route_class="healthz",http_response_status_class="5xx"}'
        values: '0+5x30'
      - series: 'openmettle_http_server_requests_total{job="openmettle-worker",instance="b",http_request_method="GET",openmettle_route_class="v1",http_response_status_class="5xx"}'
        values: '0+5x30'
    alert_rule_test:
      - eval_time: 12m
        alertname: OpenMettleApiHighServerErrorRatio
        exp_alerts: []

  - name: api_high_server_error_ratio_silent_below_ratio_ceiling
    interval: 30s
    input_series:
      - series: 'openmettle_http_server_requests_total{job="openmettle-api",instance="a",http_request_method="GET",openmettle_route_class="v1",http_response_status_class="2xx"}'
        values: '0+96x30'
      - series: 'openmettle_http_server_requests_total{job="openmettle-api",instance="a",http_request_method="GET",openmettle_route_class="v1",http_response_status_class="5xx"}'
        values: '0+4x30'
    alert_rule_test:
      - eval_time: 12m
        alertname: OpenMettleApiHighServerErrorRatio
        exp_alerts: []

  - name: api_high_server_error_ratio_silent_below_minimum_volume
    interval: 30s
    input_series:
      - series: 'openmettle_http_server_requests_total{job="openmettle-api",instance="a",http_request_method="GET",openmettle_route_class="v1",http_response_status_class="2xx"}'
        values: '0+1x30'
      - series: 'openmettle_http_server_requests_total{job="openmettle-api",instance="a",http_request_method="GET",openmettle_route_class="v1",http_response_status_class="5xx"}'
        values: '0+0.2x30'
    alert_rule_test:
      - eval_time: 12m
        alertname: OpenMettleApiHighServerErrorRatio
        exp_alerts: []

  # --- OpenMettleDatabaseReadinessFailing ------------------------------------------------
  - name: database_readiness_failing_fires_on_non_ok_outcomes
    interval: 30s
    input_series:
      - series: 'openmettle_db_readiness_checks_total{job="openmettle-api",instance="a",outcome="timeout"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 12m
        alertname: OpenMettleDatabaseReadinessFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              service: openmettle-core
              signal_contract: v1
              outcome: timeout
            exp_annotations:
              summary: "OpenMettle database readiness checks are failing"
              description: "Readiness probe /readyz recorded repeated non-ok database checks."

  - name: database_readiness_failing_fires_on_single_burst_from_zero_baseline_and_resolves
    interval: 30s
    input_series:
      - series: 'openmettle_db_readiness_checks_total{job="openmettle-api",instance="a",outcome="error"}'
        values: '0x6 3x24'
    alert_rule_test:
      - eval_time: 6m
        alertname: OpenMettleDatabaseReadinessFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              service: openmettle-core
              signal_contract: v1
              outcome: error
            exp_annotations:
              summary: "OpenMettle database readiness checks are failing"
              description: "Readiness probe /readyz recorded repeated non-ok database checks."
      - eval_time: 10m
        alertname: OpenMettleDatabaseReadinessFailing
        exp_alerts: []

  - name: database_readiness_failing_silent_on_ok_or_below_threshold
    interval: 30s
    input_series:
      - series: 'openmettle_db_readiness_checks_total{job="openmettle-api",instance="a",outcome="ok"}'
        values: '0+5x30'
      - series: 'openmettle_db_readiness_checks_total{job="openmettle-api",instance="a",outcome="error"}'
        values: '0+0.1x30'
    alert_rule_test:
      - eval_time: 12m
        alertname: OpenMettleDatabaseReadinessFailing
        exp_alerts: []

  # --- OpenMettleTelemetryDropsDetected --------------------------------------------------
  - name: telemetry_drops_detected_fires_on_first_outage_from_zero_and_resolves
    interval: 30s
    input_series:
      - series: 'openmettle_telemetry_dropped_total{job="openmettle-api",instance="a",signal="metric_exports"}'
        values: '0x10 _x3 6x35'
    alert_rule_test:
      - eval_time: 13m
        alertname: OpenMettleTelemetryDropsDetected
        exp_alerts:
          - exp_labels:
              severity: warning
              service: openmettle-core
              signal_contract: v1
              signal: metric_exports
            exp_annotations:
              summary: "OpenMettle telemetry drops detected"
              description: "The bounded stderr sink or OTLP exporter dropped telemetry items due to queue saturation or collector unavailability."
      - eval_time: 21m
        alertname: OpenMettleTelemetryDropsDetected
        exp_alerts: []

  - name: telemetry_drops_detected_fires_on_subsequent_single_outage_step_and_resolves
    interval: 30s
    input_series:
      - series: 'openmettle_telemetry_dropped_total{job="openmettle-api",instance="a",signal="metric_exports"}'
        values: '2x10 6x35'
    alert_rule_test:
      - eval_time: 11m
        alertname: OpenMettleTelemetryDropsDetected
        exp_alerts:
          - exp_labels:
              severity: warning
              service: openmettle-core
              signal_contract: v1
              signal: metric_exports
            exp_annotations:
              summary: "OpenMettle telemetry drops detected"
              description: "The bounded stderr sink or OTLP exporter dropped telemetry items due to queue saturation or collector unavailability."
      - eval_time: 21m
        alertname: OpenMettleTelemetryDropsDetected
        exp_alerts: []

  - name: telemetry_drops_detected_silent_when_counter_is_flat
    interval: 30s
    input_series:
      - series: 'openmettle_telemetry_dropped_total{job="openmettle-api",instance="a",signal="log_lines"}'
        values: '5+0x35'
    alert_rule_test:
      - eval_time: 16m
        alertname: OpenMettleTelemetryDropsDetected
        exp_alerts: []

  # --- OpenMettleProviderTransportFailures -----------------------------------------------
  - name: provider_transport_failures_fires_on_repeated_errors
    interval: 30s
    input_series:
      - series: 'openmettle_provider_http_requests_total{job="openmettle-api",instance="a",operation="jwks",outcome="timeout"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 12m
        alertname: OpenMettleProviderTransportFailures
        exp_alerts:
          - exp_labels:
              severity: warning
              service: openmettle-core
              signal_contract: v1
              operation: jwks
              outcome: timeout
            exp_annotations:
              summary: "OpenMettle outbound provider transport failures"
              description: "Repeated outbound provider HTTP requests (OIDC, inference, MCP, or OAuth refresh) failed over hardened transports."

  - name: provider_transport_failures_covers_inference_mcp_and_oauth_refresh
    interval: 30s
    input_series:
      - series: 'openmettle_provider_http_requests_total{job="openmettle-worker",instance="w",operation="inference",outcome="http_error"}'
        values: '0+1x30'
      - series: 'openmettle_provider_http_requests_total{job="openmettle-worker",instance="w",operation="mcp",outcome="transport"}'
        values: '0+1x30'
      - series: 'openmettle_provider_http_requests_total{job="openmettle-worker",instance="w",operation="oauth_refresh",outcome="timeout"}'
        values: '0+1x30'
      - series: 'openmettle_provider_http_requests_total{job="openmettle-worker",instance="w",operation="inference",outcome="ok"}'
        values: '0+10x30'
    alert_rule_test:
      - eval_time: 12m
        alertname: OpenMettleProviderTransportFailures
        exp_alerts:
          - exp_labels:
              severity: warning
              service: openmettle-core
              signal_contract: v1
              operation: inference
              outcome: http_error
            exp_annotations:
              summary: "OpenMettle outbound provider transport failures"
              description: "Repeated outbound provider HTTP requests (OIDC, inference, MCP, or OAuth refresh) failed over hardened transports."
          - exp_labels:
              severity: warning
              service: openmettle-core
              signal_contract: v1
              operation: mcp
              outcome: transport
            exp_annotations:
              summary: "OpenMettle outbound provider transport failures"
              description: "Repeated outbound provider HTTP requests (OIDC, inference, MCP, or OAuth refresh) failed over hardened transports."
          - exp_labels:
              severity: warning
              service: openmettle-core
              signal_contract: v1
              operation: oauth_refresh
              outcome: timeout
            exp_annotations:
              summary: "OpenMettle outbound provider transport failures"
              description: "Repeated outbound provider HTTP requests (OIDC, inference, MCP, or OAuth refresh) failed over hardened transports."

  - name: provider_transport_failures_fires_on_startup_bursts_from_zero_baseline_and_resolves
    interval: 30s
    input_series:
      - series: 'openmettle_provider_http_requests_total{job="openmettle-worker",instance="w",operation="inference",outcome="transport"}'
        values: '0x4 3x6 6x24'
    alert_rule_test:
      - eval_time: 9m
        alertname: OpenMettleProviderTransportFailures
        exp_alerts:
          - exp_labels:
              severity: warning
              service: openmettle-core
              signal_contract: v1
              operation: inference
              outcome: transport
            exp_annotations:
              summary: "OpenMettle outbound provider transport failures"
              description: "Repeated outbound provider HTTP requests (OIDC, inference, MCP, or OAuth refresh) failed over hardened transports."
      - eval_time: 12m
        alertname: OpenMettleProviderTransportFailures
        exp_alerts: []

  - name: provider_transport_failures_silent_on_ok_or_below_threshold
    interval: 30s
    input_series:
      - series: 'openmettle_provider_http_requests_total{job="openmettle-api",instance="a",operation="discovery",outcome="ok"}'
        values: '0+10x30'
      - series: 'openmettle_provider_http_requests_total{job="openmettle-worker",instance="w",operation="mcp",outcome="ok"}'
        values: '0+10x30'
      - series: 'openmettle_provider_http_requests_total{job="openmettle-worker",instance="w",operation="oauth_refresh",outcome="ok"}'
        values: '0+10x30'
      - series: 'openmettle_provider_http_requests_total{job="openmettle-worker",instance="w",operation="oauth_refresh",outcome="cancelled"}'
        values: '0+10x30'
      - series: 'openmettle_provider_http_requests_total{job="openmettle-api",instance="a",operation="token",outcome="transport"}'
        values: '0+0.1x30'
    alert_rule_test:
      - eval_time: 12m
        alertname: OpenMettleProviderTransportFailures
        exp_alerts: []

  # --- OpenMettleGatewayFailuresDetected -------------------------------------------------
  - name: gateway_failures_detected_fires_on_repeated_failures
    interval: 30s
    input_series:
      - series: 'openmettle_gateway_failures_total{job="openmettle-gateway",instance="g",step="usage",cause="timeout"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: OpenMettleGatewayFailuresDetected
        exp_alerts:
          - exp_labels:
              severity: warning
              service: openmettle-gateway
              signal_contract: v1
              step: usage
              cause: timeout
            exp_annotations:
              summary: "OpenMettle gateway failures detected"
              description: "Repeated inference gateway failures were recorded by step and cause over the last 5 minutes."

  - name: gateway_failures_detected_fires_on_single_burst_from_zero_baseline_and_resolves
    interval: 30s
    input_series:
      - series: 'openmettle_gateway_failures_total{job="openmettle-gateway",instance="g",step="policy",cause="timeout"}'
        values: '0x6 3x24'
    alert_rule_test:
      - eval_time: 6m
        alertname: OpenMettleGatewayFailuresDetected
        exp_alerts:
          - exp_labels:
              severity: warning
              service: openmettle-gateway
              signal_contract: v1
              step: policy
              cause: timeout
            exp_annotations:
              summary: "OpenMettle gateway failures detected"
              description: "Repeated inference gateway failures were recorded by step and cause over the last 5 minutes."
      - eval_time: 10m
        alertname: OpenMettleGatewayFailuresDetected
        exp_alerts: []

  - name: gateway_failures_detected_silent_below_threshold_or_flat
    interval: 30s
    input_series:
      - series: 'openmettle_gateway_failures_total{job="openmettle-gateway",instance="g",step="policy",cause="policy"}'
        values: '0+0.1x30'
      - series: 'openmettle_gateway_failures_total{job="openmettle-gateway",instance="g",step="key",cause="transport"}'
        values: '4+0x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: OpenMettleGatewayFailuresDetected
        exp_alerts: []

  # --- OpenMettleRunQueueHighAge ---------------------------------------------------------
  - name: run_queue_high_age_fires_when_runs_wait_over_60s
    interval: 30s
    input_series:
      - series: 'openmettle_runs_queue_age_seconds_bucket{job="openmettle-worker",instance="w",outcome="claimed",le="60"}'
        values: '0x30'
      - series: 'openmettle_runs_queue_age_seconds_bucket{job="openmettle-worker",instance="w",outcome="claimed",le="+Inf"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 12m
        alertname: OpenMettleRunQueueHighAge
        exp_alerts:
          - exp_labels:
              severity: warning
              service: openmettle-worker
              signal_contract: v1
              outcome: claimed
            exp_annotations:
              summary: "OpenMettle runs waiting over 60s in durable work queue"
              description: "One or more runs waited longer than 60 seconds in the durable work queue before leaving the queue over the last 10 minutes."

  - name: run_queue_high_age_fires_on_single_slow_exit_from_zero_baseline_and_resolves
    interval: 30s
    input_series:
      - series: 'openmettle_runs_queue_age_seconds_bucket{job="openmettle-worker",instance="w",outcome="claimed",le="60"}'
        values: '0x40'
      - series: 'openmettle_runs_queue_age_seconds_bucket{job="openmettle-worker",instance="w",outcome="claimed",le="+Inf"}'
        values: '0x10 1x30'
    alert_rule_test:
      - eval_time: 11m
        alertname: OpenMettleRunQueueHighAge
        exp_alerts:
          - exp_labels:
              severity: warning
              service: openmettle-worker
              signal_contract: v1
              outcome: claimed
            exp_annotations:
              summary: "OpenMettle runs waiting over 60s in durable work queue"
              description: "One or more runs waited longer than 60 seconds in the durable work queue before leaving the queue over the last 10 minutes."
      - eval_time: 16m
        alertname: OpenMettleRunQueueHighAge
        exp_alerts: []

  - name: run_queue_high_age_silent_when_all_runs_under_60s
    interval: 30s
    input_series:
      - series: 'openmettle_runs_queue_age_seconds_bucket{job="openmettle-worker",instance="w",outcome="claimed",le="60"}'
        values: '0+2x30'
      - series: 'openmettle_runs_queue_age_seconds_bucket{job="openmettle-worker",instance="w",outcome="claimed",le="+Inf"}'
        values: '0+2x30'
    alert_rule_test:
      - eval_time: 12m
        alertname: OpenMettleRunQueueHighAge
        exp_alerts: []

  - name: run_queue_high_age_silent_after_historical_slow_exits_followed_by_fast_exits
    interval: 30s
    input_series:
      # 10 historical >60s exits followed exclusively by fast (<=60s) exits (+3 every 30s for 10m).
      # Subtracting per-series cumulative buckets before increase() keeps (+Inf - le="60") flat at
      # 10 and prevents asymmetric counter extrapolation from false-firing.
      - series: 'openmettle_runs_queue_age_seconds_bucket{job="openmettle-worker",instance="w",outcome="claimed",le="60"}'
        values: '0+3x20 60x20'
      - series: 'openmettle_runs_queue_age_seconds_bucket{job="openmettle-worker",instance="w",outcome="claimed",le="+Inf"}'
        values: '10+3x20 70x20'
    alert_rule_test:
      - eval_time: 7m
        alertname: OpenMettleRunQueueHighAge
        exp_alerts: []
      - eval_time: 9m
        alertname: OpenMettleRunQueueHighAge
        exp_alerts: []
      - eval_time: 12m
        alertname: OpenMettleRunQueueHighAge
        exp_alerts: []

  - name: run_queue_high_age_fires_on_new_slow_exit_amid_fast_exits
    interval: 30s
    input_series:
      # 10 historical >60s exits, steady fast exits (+3 every 30s), plus 1 new >60s exit at t=5m30s.
      - series: 'openmettle_runs_queue_age_seconds_bucket{job="openmettle-worker",instance="w",outcome="claimed",le="60"}'
        values: '0+3x35'
      - series: 'openmettle_runs_queue_age_seconds_bucket{job="openmettle-worker",instance="w",outcome="claimed",le="+Inf"}'
        values: '10+3x10 44+3x24'
    alert_rule_test:
      - eval_time: 11m
        alertname: OpenMettleRunQueueHighAge
        exp_alerts:
          - exp_labels:
              severity: warning
              service: openmettle-worker
              signal_contract: v1
              outcome: claimed
            exp_annotations:
              summary: "OpenMettle runs waiting over 60s in durable work queue"
              description: "One or more runs waited longer than 60 seconds in the durable work queue before leaving the queue over the last 10 minutes."
      - eval_time: 16m
        alertname: OpenMettleRunQueueHighAge
        exp_alerts: []

  # --- OpenMettleStorageQuotaDriftDetected -----------------------------------------------
  - name: storage_quota_drift_fires_on_drift_and_resolves
    interval: 30s
    input_series:
      - series: 'openmettle_storage_quota_drift_total{job="openmettle-worker",instance="a",outcome="budgets"}'
        values: '0x10 2x370'
    alert_rule_test:
      - eval_time: 11m
        alertname: OpenMettleStorageQuotaDriftDetected
        exp_alerts:
          - exp_labels:
              severity: critical
              service: openmettle-worker
              signal_contract: v1
              outcome: budgets
            exp_annotations:
              summary: "OpenMettle storage or quota accounting drift detected"
              description: "Periodic worker drift verification reported ledger mismatches, filesystem drift, quarantined rows, errors, or timeouts."
      - eval_time: 186m
        alertname: OpenMettleStorageQuotaDriftDetected
        exp_alerts: []

  - name: storage_quota_drift_stays_firing_across_jittered_hourly_sweeps
    interval: 30s
    input_series:
      # Two consecutive drift observations separated by 132m (t=5m30s and t=137m30s), exceeding
      # both the default >60m jittered interval and max SWEEP_MS=3_600_000 (+20% jitter = 132m).
      - series: 'openmettle_storage_quota_drift_total{job="openmettle-worker",instance="a",outcome="storage_accounts"}'
        values: '0x10 1x263 2x400'
    alert_rule_test:
      - eval_time: 11m
        alertname: OpenMettleStorageQuotaDriftDetected
        exp_alerts:
          - exp_labels:
              severity: critical
              service: openmettle-worker
              signal_contract: v1
              outcome: storage_accounts
            exp_annotations:
              summary: "OpenMettle storage or quota accounting drift detected"
              description: "Periodic worker drift verification reported ledger mismatches, filesystem drift, quarantined rows, errors, or timeouts."
      - eval_time: 70m
        alertname: OpenMettleStorageQuotaDriftDetected
        exp_alerts:
          - exp_labels:
              severity: critical
              service: openmettle-worker
              signal_contract: v1
              outcome: storage_accounts
            exp_annotations:
              summary: "OpenMettle storage or quota accounting drift detected"
              description: "Periodic worker drift verification reported ledger mismatches, filesystem drift, quarantined rows, errors, or timeouts."
      - eval_time: 137m
        alertname: OpenMettleStorageQuotaDriftDetected
        exp_alerts:
          - exp_labels:
              severity: critical
              service: openmettle-worker
              signal_contract: v1
              outcome: storage_accounts
            exp_annotations:
              summary: "OpenMettle storage or quota accounting drift detected"
              description: "Periodic worker drift verification reported ledger mismatches, filesystem drift, quarantined rows, errors, or timeouts."
      - eval_time: 186m
        alertname: OpenMettleStorageQuotaDriftDetected
        exp_alerts:
          - exp_labels:
              severity: critical
              service: openmettle-worker
              signal_contract: v1
              outcome: storage_accounts
            exp_annotations:
              summary: "OpenMettle storage or quota accounting drift detected"
              description: "Periodic worker drift verification reported ledger mismatches, filesystem drift, quarantined rows, errors, or timeouts."
      - eval_time: 318m
        alertname: OpenMettleStorageQuotaDriftDetected
        exp_alerts: []

  - name: storage_quota_drift_fires_on_error_and_timeout_ignoring_healthy
    interval: 30s
    input_series:
      - series: 'openmettle_storage_quota_drift_total{job="openmettle-worker",instance="a",outcome="healthy"}'
        values: '0+1x30'
      - series: 'openmettle_storage_quota_drift_total{job="openmettle-worker",instance="a",outcome="error"}'
        values: '0x10 1x20'
      - series: 'openmettle_storage_quota_drift_total{job="openmettle-worker",instance="a",outcome="timeout"}'
        values: '0x10 1x20'
    alert_rule_test:
      - eval_time: 11m
        alertname: OpenMettleStorageQuotaDriftDetected
        exp_alerts:
          - exp_labels:
              severity: critical
              service: openmettle-worker
              signal_contract: v1
              outcome: error
            exp_annotations:
              summary: "OpenMettle storage or quota accounting drift detected"
              description: "Periodic worker drift verification reported ledger mismatches, filesystem drift, quarantined rows, errors, or timeouts."
          - exp_labels:
              severity: critical
              service: openmettle-worker
              signal_contract: v1
              outcome: timeout
            exp_annotations:
              summary: "OpenMettle storage or quota accounting drift detected"
              description: "Periodic worker drift verification reported ledger mismatches, filesystem drift, quarantined rows, errors, or timeouts."

  - name: storage_quota_drift_silent_on_healthy_and_flat_counters
    interval: 30s
    input_series:
      - series: 'openmettle_storage_quota_drift_total{job="openmettle-worker",instance="a",outcome="healthy"}'
        values: '0+1x30'
      - series: 'openmettle_storage_quota_drift_total{job="openmettle-worker",instance="a",outcome="files"}'
        values: '3+0x30'
      - series: 'openmettle_storage_quota_drift_total{job="openmettle-worker",instance="a",outcome="quarantined"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 11m
        alertname: OpenMettleStorageQuotaDriftDetected
        exp_alerts: []

  # --- OpenMettleBackupFailedOrOverdue ---------------------------------------------------
  - name: backup_failed_incomplete_and_overdue_fire_immediately_from_zero_baseline
    interval: 30s
    input_series:
      - series: 'openmettle_backup_runs_total{job="openmettle-worker",instance="a",outcome="succeeded"}'
        values: '0+1x40'
      - series: 'openmettle_backup_runs_total{job="openmettle-worker",instance="a",outcome="failed"}'
        values: '0x10 1x30'
      - series: 'openmettle_backup_runs_total{job="openmettle-worker",instance="a",outcome="incomplete"}'
        values: '0x10 1x30'
      - series: 'openmettle_backup_runs_total{job="openmettle-worker",instance="a",outcome="overdue"}'
        values: '0x10 1x30'
    alert_rule_test:
      - eval_time: 6m
        alertname: OpenMettleBackupFailedOrOverdue
        exp_alerts:
          - exp_labels:
              severity: critical
              service: openmettle-worker
              component: backup
              signal_contract: v1
              outcome: failed
            exp_annotations:
              summary: "OpenMettle coordinated backup failed, incomplete, or overdue"
              description: "Coordinated maintenance-window backup capture reported a failed or incomplete run, or exceeded its configured RPO target."
          - exp_labels:
              severity: critical
              service: openmettle-worker
