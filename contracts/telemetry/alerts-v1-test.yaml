              outcome: overdue
            exp_annotations:
              summary: "OpenMettle coordinated backup failed, incomplete, or overdue"
              description: "Coordinated maintenance-window backup capture reported a failed or incomplete run, or exceeded its configured RPO target."
      - eval_time: 21m
        alertname: OpenMettleBackupFailedOrOverdue
        exp_alerts: []

  - name: backup_alert_silent_when_only_succeeded_increments_and_failure_counters_flat
    interval: 30s
    input_series:
