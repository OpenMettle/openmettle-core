# Deterministic Prometheus alert rules for OpenMettle telemetry contract v1 (ADR 0028).
# Every metric and label referenced here is defined in contracts/telemetry/v1.json.
# No user, scope, run, or request identifier may appear in alert expressions or labels.
groups:
  - name: openmettle-core-v1
    interval: 30s
    rules:
      - alert: OpenMettleApiHighServerErrorRatio
        expr: |
          (
            sum(rate(openmettle_http_server_requests_total{job="openmettle-api",openmettle_route_class!~"healthz|readyz",http_response_status_class="5xx"}[5m]))
            /
            clamp_min(sum(rate(openmettle_http_server_requests_total{job="openmettle-api",openmettle_route_class!~"healthz|readyz"}[5m])), 1e-9)
          ) > 0.05
          and
          sum(increase(openmettle_http_server_requests_total{job="openmettle-api",openmettle_route_class!~"healthz|readyz",http_response_status_class="5xx"}[5m])) >= 5
        for: 5m
        labels:
          severity: warning
          service: openmettle-api
          signal_contract: v1
        annotations:
          summary: "OpenMettle API HTTP 5xx error ratio exceeded 5%"
          description: "More than 5% of non-probe API HTTP requests returned 5xx over the last 5 minutes."

      - alert: OpenMettleDatabaseReadinessFailing
        expr: |
          sum by (outcome) (increase(openmettle_db_readiness_checks_total{outcome!="ok"}[5m])) >= 3
        for: 2m
        labels:
          severity: critical
          service: openmettle-core
          signal_contract: v1
        annotations:
          summary: "OpenMettle database readiness checks are failing"
          description: "Readiness probe /readyz recorded repeated non-ok database checks."

      - alert: OpenMettleTelemetryDropsDetected
        expr: |
          sum by (signal) (increase(openmettle_telemetry_dropped_total[15m])) > 0
        for: 5m
        labels:
          severity: warning
          service: openmettle-core
          signal_contract: v1
        annotations:
          summary: "OpenMettle telemetry drops detected"
          description: "The bounded stderr sink or OTLP exporter dropped telemetry items due to queue saturation or collector unavailability."

      - alert: OpenMettleProviderTransportFailures
        expr: |
          sum by (operation, outcome) (increase(openmettle_provider_http_requests_total{outcome!~"ok|cancelled"}[5m])) >= 3
        for: 5m
        labels:
          severity: warning
          service: openmettle-core
          signal_contract: v1
        annotations:
          summary: "OpenMettle outbound provider transport failures"
          description: "Repeated outbound provider HTTP requests (OIDC, inference, MCP, or OAuth refresh) failed over hardened transports."

      - alert: OpenMettleGatewayFailuresDetected
        expr: |
          sum by (step, cause) (increase(openmettle_gateway_failures_total[5m])) >= 3
        for: 2m
        labels:
          severity: warning
          service: openmettle-gateway
          signal_contract: v1
        annotations:
          summary: "OpenMettle gateway failures detected"
          description: "Repeated inference gateway failures were recorded by step and cause over the last 5 minutes."

      - alert: OpenMettleRunQueueHighAge
        expr: |
          sum by (outcome) (increase(openmettle_runs_queue_slow_exits_total[10m])) >= 1
        for: 5m
        labels:
          severity: warning
          service: openmettle-worker
          signal_contract: v1
        annotations:
          summary: "OpenMettle runs waiting over 60s in durable work queue"
          description: "One or more runs waited longer than 60 seconds in the durable work queue before leaving the queue over the last 10 minutes."

      - alert: OpenMettleStorageQuotaDriftDetected
        expr: |
          sum by (outcome) (increase(openmettle_storage_quota_drift_total{outcome!="healthy"}[3h])) > 0
        for: 5m
        labels:
          severity: critical
          service: openmettle-worker
          signal_contract: v1
        annotations:
          summary: "OpenMettle storage or quota accounting drift detected"
          description: "Periodic worker drift verification reported ledger mismatches, filesystem drift, quarantined rows, errors, or timeouts."

      - alert: OpenMettleBackupFailedOrOverdue
        expr: |
          sum by (outcome) (increase(openmettle_backup_runs_total{outcome=~"failed|incomplete|overdue"}[15m])) > 0
        for: 0m
        labels:
          severity: critical
          service: openmettle-worker
          component: backup
          signal_contract: v1
        annotations:
          summary: "OpenMettle coordinated backup failed, incomplete, or overdue"
          description: "Coordinated maintenance-window backup capture reported a failed or incomplete run, or exceeded its configured RPO target."
