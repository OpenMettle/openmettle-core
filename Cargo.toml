[workspace]
members = ["."]
resolver = "3"

[package]
name = "openmettle-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

[[bin]]
name = "openmettle-api"
path = "src/bin/api.rs"

[[bin]]
name = "openmettle-worker"
path = "src/bin/worker.rs"

[[bin]]
name = "openmettle-migrate"
path = "src/bin/migrate.rs"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "=1.54.1", default-features = false, features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-native-roots"] }
sqlx-core = { version = "=0.9.0", default-features = false }
sqlx-postgres = { version = "=0.9.0", default-features = false, features = ["migrate"] }
sha2 = { version = "=0.10.9", default-features = false }

# Contract tests only (ADR 0007); not linked into any binary.
[dev-dependencies]
jsonschema = { version = "=0.61.2", default-features = false }
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std"] }
