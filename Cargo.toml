[workspace]
members = ["."]
resolver = "3"

[package]
name = "openmettle-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

[[bin]]
name = "openmettle-api"
path = "src/bin/api.rs"

[[bin]]
name = "openmettle-worker"
path = "src/bin/worker.rs"

[[bin]]
name = "openmettle-migrate"
path = "src/bin/migrate.rs"

[[bin]]
name = "openmettle-admin"
path = "src/bin/admin.rs"

# OpenMettle's own inference proxy (V1-06, ADR 0044; docs/operator/gateway-proxy.md).
[[bin]]
name = "openmettle-gateway"
path = "src/bin/gateway.rs"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
# Safe directory-relative filesystem operations. Origin: github.com/bytecodealliance/rustix
# Licence: Apache-2.0 WITH LLVM-exception OR Apache-2.0 OR MIT.
rustix = { version = "=1.1.6", default-features = false, features = ["fs", "std"] }
# `matched-path` adds no crate; it lets telemetry record the route template, never the target.
axum = { version = "=0.8.9", default-features = false, features = ["http1", "matched-path", "tokio"] }
tokio = { version = "=1.54.1", default-features = false, features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-native-roots"] }
sqlx-core = { version = "=0.9.0", default-features = false }
sqlx-postgres = { version = "=0.9.0", default-features = false, features = ["migrate"] }
sha2 = { version = "=0.10.9", default-features = false }
# Offline OIDC ID-token verification (ADR 0008): no HTTP client feature. chrono, serde and
# serde_json were already locked; they are direct only for the verifier's clock and claims types.
openidconnect = { version = "=4.1.0", default-features = false }
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std"] }

# Decode the library-parsed public RSA modulus for its minimum-strength check (ADR 0008).
base64 = { version = "=0.22.1", default-features = false, features = ["std"] }

# Provider token transport (ADR 0010): one HTTP/1.1 request per TLS connection, driven in the
# caller's future. hyper, hyper-util, http-body-util, rustls, rustls-native-certs and bytes were
# already locked; tokio-rustls (github.com/rustls/tokio-rustls, MIT OR Apache-2.0) is new and
# uses the explicit ring provider. No aws-lc-rs, HTTP/2, proxy or reqwest.
hyper = { version = "=1.12.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
http-body-util = { version = "=0.1.5", default-features = false }
bytes = { version = "=1.12.1", default-features = false, features = ["std"] }
httpdate = "=1.0.3"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = { version = "=0.8.5", default-features = false }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }

# Process telemetry (ADR 0024): structured stderr logs behind a default-deny callsite guard.
# tracing (MIT) was already locked through sqlx. tracing-subscriber (MIT) is new, with no
# env-filter, ansi or tracing-log (`log` bridge). Origin: github.com/tokio-rs/tracing.
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["std", "registry", "fmt", "json"] }

# OTLP/HTTP protobuf trace export (ADR 0026), off by default. Only the API types, the SDK span
# model, the generated protobuf messages and the tracing bridge: no opentelemetry-otlp,
# opentelemetry-http, tonic, h2, reqwest, compression, async runtime integration or log bridge.
# Spans travel over the ADR 0010 transport core. Origin: github.com/open-telemetry/opentelemetry-rust
# (Apache-2.0) and github.com/tokio-rs/tracing-opentelemetry (MIT).
opentelemetry = { version = "=0.33.1", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "=0.33.1", default-features = false, features = ["trace"] }
opentelemetry-proto = { version = "=0.33.1", default-features = false, features = ["gen-tonic-messages", "trace", "metrics"] }
tracing-opentelemetry = { version = "=0.34.0", default-features = false }
# `Message::encode_to_vec` for the generated request; already locked through opentelemetry-proto.
prost = { version = "=0.14.6", default-features = false }

# Login protection: ring (Apache-2.0 AND ISC), subtle (BSD-3-Clause), already locked.
# Origins: github.com/briansmith/ring; github.com/dalek-cryptography/subtle.
[dependencies.ring]
version = "=0.17.14"
default-features = false
features = ["std"]

[dependencies.subtle]
version = "=2.6.1"
default-features = false

# Test-only (ADR 0007 contract tests; ADR 0008 in-memory signing keys); not linked into binaries.
[dev-dependencies]
jsonschema = { version = "=0.61.2", default-features = false }
rsa = { version = "=0.9.10", default-features = false, features = ["std", "pem"] }
rand_core = { version = "=0.6.4", default-features = false, features = ["getrandom"] }
# ADR 0010: in-memory synthetic TLS CA and leaf certificates (github.com/rustls/rcgen, MIT OR Apache-2.0).
rcgen = { version = "=0.14.10", default-features = false, features = ["ring"] }
